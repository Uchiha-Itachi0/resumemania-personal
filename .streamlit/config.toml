[theme]
base = "light"
primaryColor = "#C7F24E"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F7F6F3"
textColor = "#171717"
borderColor = "#E4E1DA"
baseRadius = "14px"
font = "Plus Jakarta Sans:https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap"
codeFont = "Geist Mono:https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap"

[client]
toolbarMode = "minimal"
showSidebarNavigation = false

[server]
maxUploadSize = 5

[browser]
gatherUsageStats = false
